name: Export full NTE package 20261008
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package current main sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'NTE-Merged-Source'
          $files=@(
            'plugins/NteAttackReplay/plugin.cpp',
            'plugins/NteAttackReplay/manifest.json',
            'plugins/NteVehicle/plugin.cpp',
            'plugins/NteVehicle/manifest.json',
            'src/game/ue5/ue5_nte_adapter.cpp',
            'Anomaly-2.0.0-sdk/include/anomaly/sdk/services/nte.h'
          )
          foreach($f in $files){$src=Join-Path $env:GITHUB_WORKSPACE $f;if(!(Test-Path $src)){throw "Missing $f"};$dst=Join-Path $root $f;New-Item -ItemType Directory -Force -Path (Split-Path $dst)|Out-Null;Copy-Item $src $dst}
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'NTE-Merged-Source.zip') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NTE-Merged-Source
          path: NTE-Merged-Source.zip
          if-no-files-found: error
