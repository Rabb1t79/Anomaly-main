name: nte-attack-replay-debug

on:
  push:
    branches:
      - feature/nte-attack-replay

jobs:
  build-plugin:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-vs2022 -DANOMALY_BUILD_BUILTIN_PLUGINS=ON
      - name: Build attack replay plugin
        shell: pwsh
        run: |
          $log = Join-Path $PWD "attack-replay-build.log"
          & cmake --build .build/windows-vs2022 --config RelWithDebInfo --target anomaly_builtin_nte_attack_replay --parallel --verbose 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Stage plugin
        shell: pwsh
        run: |
          $src = ".build/windows-vs2022/bin/RelWithDebInfo/builtin-plugins/NteAttackReplay"
          if (!(Test-Path "$src/plugin.dll")) { throw "plugin.dll was not produced at $src" }
          if (!(Test-Path "$src/manifest.json")) { throw "manifest.json was not produced at $src" }
          New-Item -ItemType Directory -Force -Path artifact/NteAttackReplay | Out-Null
          Copy-Item "$src/plugin.dll" artifact/NteAttackReplay/plugin.dll
          Copy-Item "$src/manifest.json" artifact/NteAttackReplay/manifest.json
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay
          path: artifact/NteAttackReplay
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-build-log
          path: attack-replay-build.log
          if-no-files-found: warn
