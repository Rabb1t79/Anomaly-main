name: Rebuild optional plugins with SDK exception bridge

on:
  push:
    branches:
      - '**'
    paths:
      - 'plugins/MapSpawnExporter/**'
      - 'plugins/TeleportLandmarksProbe/**'
      - 'plugins/NtePickupDemo/**'
      - 'plugins/NteMovementHold/**'
      - 'plugins/common/**'
      - 'include/anomaly/sdk/**'
      - 'sdk/cpp/plugin_cxx_throw_bridge.cpp'
      - '.github/workflows/build-optional-plugin-bridge-repair.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugins/MapSpawnExporter/**'
      - 'plugins/TeleportLandmarksProbe/**'
      - 'plugins/NtePickupDemo/**'
      - 'plugins/NteMovementHold/**'
      - 'plugins/common/**'
      - 'include/anomaly/sdk/**'
      - 'sdk/cpp/plugin_cxx_throw_bridge.cpp'
      - '.github/workflows/build-optional-plugin-bridge-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure standalone plugin packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $src = Join-Path $env:GITHUB_WORKSPACE '.build/bridge-repair-src'
          $build = Join-Path $env:GITHUB_WORKSPACE '.build/bridge-repair'
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          $cmakeLists = @'
          cmake_minimum_required(VERSION 3.22)
          project(AnomalyBridgeRepairPlugins LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(ROOT "@ROOT@")
          function(add_bridge_plugin target package source)
            add_library(${target} SHARED
              "${ROOT}/plugins/${source}/plugin.cpp"
              "${ROOT}/sdk/cpp/plugin_cxx_throw_bridge.cpp")
            target_include_directories(${target} PRIVATE "${ROOT}/include" "${ROOT}")
            target_compile_definitions(${target} PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
            if(MSVC)
              target_compile_options(${target} PRIVATE /W4 /permissive- /EHsc /Zc:threadSafeInit-)
            endif()
            set_target_properties(${target} PROPERTIES
              OUTPUT_NAME "plugin"
              PREFIX ""
              RUNTIME_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/${package}"
              LIBRARY_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/${package}"
              ARCHIVE_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/lib/${package}")
          endfunction()
          add_bridge_plugin(map_spawn_exporter MapSpawnExporter MapSpawnExporter)
          add_bridge_plugin(teleport_landmarks_probe TeleportLandmarksProbe TeleportLandmarksProbe)
          add_bridge_plugin(nte_pickup_demo NtePickupDemo NtePickupDemo)
          add_bridge_plugin(nte_movement_hold NteMovementHold NteMovementHold)
          '@
          $cmakeLists = $cmakeLists.Replace('@ROOT@', $root)
          Set-Content -LiteralPath (Join-Path $src 'CMakeLists.txt') -Value $cmakeLists -Encoding utf8
          cmake -S $src -B $build -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
      - name: Build, verify exports and stage packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE '.build/bridge-repair'
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Plugin build failed: $LASTEXITCODE" }
          $vsRoot = Join-Path $env:ProgramFiles 'Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC'
          $dumpbin = Get-ChildItem -Path (Join-Path $vsRoot '*/bin/Hostx64/x64/dumpbin.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $dumpbin) { throw 'dumpbin.exe not found; cannot verify exports' }
          $stage = Join-Path $env:GITHUB_WORKSPACE '.build/bridge-repair-package/Anomaly/plugins'
          $packages = @('MapSpawnExporter', 'TeleportLandmarksProbe', 'NtePickupDemo', 'NteMovementHold')
          foreach ($package in $packages) {
            $dll = Join-Path $build "out/$package/plugin.dll"
            if (!(Test-Path -LiteralPath $dll)) { throw "plugin.dll not produced for $package" }
            $exports = (& $dumpbin.FullName /nologo /exports $dll 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $package" }
            if ($exports -notmatch 'AnomalyPluginEntryV1') { throw "$package is missing AnomalyPluginEntryV1" }
            if ($exports -notmatch 'AnomalyPluginCxxThrowV1') { throw "$package is missing AnomalyPluginCxxThrowV1" }
            $source = Join-Path $env:GITHUB_WORKSPACE "plugins/$package"
            $destination = Join-Path $stage $package
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -LiteralPath $dll -Destination (Join-Path $destination 'plugin.dll') -Force
            Copy-Item -LiteralPath (Join-Path $source 'manifest.json') -Destination (Join-Path $destination 'manifest.json') -Force
            $locales = Join-Path $source 'locales'
            if (Test-Path -LiteralPath $locales) {
              Copy-Item -LiteralPath $locales -Destination (Join-Path $destination 'locales') -Recurse -Force
            }
            Write-Host "Verified SDK exception bridge and plugin entry exports for $package"
          }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE '.build/bridge-repair-package/Anomaly') -DestinationPath (Join-Path $dist 'Anomaly-optional-plugin-bridge-repair-windows-x64.zip') -Force
      - name: Upload repaired optional plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: Anomaly-optional-plugin-bridge-repair-windows-x64
          path: dist/Anomaly-optional-plugin-bridge-repair-windows-x64.zip
          if-no-files-found: error
