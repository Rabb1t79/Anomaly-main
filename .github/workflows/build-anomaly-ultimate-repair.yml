name: build-anomaly-ultimate-repair

on:
  push:
    branches:
      - feat/ultimate-rebuild
    paths:
      - 'CMakeLists.txt'
      - 'cmake/sdk/AnomalyPlugin.cmake'
      - 'plugins/AnomalyUltimate/**'
      - '.github/workflows/build-anomaly-ultimate-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ultimate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure SDK-compliant repair build
        shell: pwsh
        run: |
          cmake --preset windows-vs2022 -DANOMALY_BUILD_TEST_FIXTURES=OFF -DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF -DANOMALY_BUILD_TEST_PLUGINS=OFF -DANOMALY_BUILD_ULTIMATE_REPAIR_PLUGIN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build AnomalyUltimate
        shell: pwsh
        run: |
          cmake --build --preset windows-relwithdebinfo --target anomaly_ultimate_repair --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE '.build\windows-vs2022\bin\RelWithDebInfo\repair-plugins\AnomalyUltimate-v1.2'
          $dll = Join-Path $package 'plugin.dll'
          $manifest = Join-Path $package 'manifest.json'
          if (!(Test-Path -LiteralPath $dll)) { throw "Missing repaired plugin: $dll" }
          if (!(Test-Path -LiteralPath $manifest)) { throw "Missing package manifest: $manifest" }

          $m = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($m.id -ne 'anomaly.local.ultimate') { throw "Unexpected manifest id: $($m.id)" }
          if ($m.version -ne '1.2.0') { throw "Unexpected manifest version: $($m.version)" }

          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact\AnomalyUltimate-v1.2'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $out 'plugin.dll') -Force
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $out 'manifest.json') -Force
          $locales = Join-Path $package 'locales'
          if (Test-Path -LiteralPath $locales) {
            Copy-Item -LiteralPath $locales -Destination (Join-Path $out 'locales') -Recurse -Force
          }
          Get-ChildItem -LiteralPath $out -Recurse -File | Select-Object FullName, Length

      - name: Upload repaired package
        uses: actions/upload-artifact@v4
        with:
          name: AnomalyUltimate-v1.2-sdk-rebuilt
          path: artifact/AnomalyUltimate-v1.2/*
          if-no-files-found: error
