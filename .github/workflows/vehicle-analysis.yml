name: vehicle-analysis
on:
  push:
    branches: [work/vehicle-final]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - name: Extract Tokky strings
        shell: pwsh
        run: |
          $p=[IO.File]::ReadAllBytes('Tokky-NTE.dll')
          $keys=@('SafeSetVehicleTransform','BeginDeferredActorSpawnFromClass','FinishSpawningActor','LoadClassAsset_Blocking','ReSetupEngineAndTransmission','SetDelayedVelocityRestore','GetActorForwardVector','K2_GetActorLocation','SetOwner','GetOwner','Instigator','GetAllActorsOfClass','VehicleDataAsset','SummonVehicleTemplateMap')
          $out=New-Object Text.StringBuilder
          $cur=New-Object Text.StringBuilder
          foreach($b in $p){ if($b -ge 32 -and $b -le 126){[void]$cur.Append([char]$b)} else { if($cur.Length -ge 6){$s=$cur.ToString(); foreach($k in $keys){if($s.ToLower().Contains($k.ToLower())){[void]$out.AppendLine($s);break}}};$cur.Clear()} }
          Set-Content tokky_keys.txt $out.ToString()
          Get-Content tokky_keys.txt
      - uses: actions/upload-artifact@v4
        with: {name: tokky-analysis, path: tokky_keys.txt}
