name: nte-vehicle-cross

on:
  push:
    branches:
      - nte-vehicle-final-20261004
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build NTE Vehicle plugin
        run: |
          mkdir -p .build/nte-vehicle-mingw dist/NteVehicle-0.7.0-windows-x64
          x86_64-w64-mingw32-g++ -std=c++20 -O2 -shared -static-libgcc -static-libstdc++ \
            -DUNICODE -D_UNICODE -DWIN32_LEAN_AND_MEAN -DNOMINMAX \
            -Iinclude plugins/NteVehicle/plugin.cpp \
            -o .build/nte-vehicle-mingw/plugin.dll
          cp .build/nte-vehicle-mingw/plugin.dll dist/NteVehicle-0.7.0-windows-x64/plugin.dll
          cp plugins/NteVehicle/manifest.json dist/NteVehicle-0.7.0-windows-x64/manifest.json
          test -f dist/NteVehicle-0.7.0-windows-x64/plugin.dll
          test -f dist/NteVehicle-0.7.0-windows-x64/manifest.json
          test "$(find dist/NteVehicle-0.7.0-windows-x64 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find dist/NteVehicle-0.7.0-windows-x64 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "manifest.json plugin.dll "
          (cd dist && zip -j "NteVehicle-0.7.0-windows-x64.zip" "NteVehicle-0.7.0-windows-x64/plugin.dll" "NteVehicle-0.7.0-windows-x64/manifest.json")

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteVehicle-0.7.0-windows-x64
          path: dist/NteVehicle-0.7.0-windows-x64.zip
          if-no-files-found: error
