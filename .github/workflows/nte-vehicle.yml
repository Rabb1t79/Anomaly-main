name: nte-vehicle

on:
  push:
    branches:
      - nte-vehicle-final-20261004
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure NTE Vehicle
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $b = "$env:GITHUB_WORKSPACE\.build\nte-vehicle"
          $src = "$env:GITHUB_WORKSPACE\.build\nte-vehicle-src"
          New-Item -ItemType Directory -Force $src | Out-Null
          @"
          cmake_minimum_required(VERSION 3.22)
          project(NteVehicleStandalone LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(nte_vehicle SHARED "$root/plugins/NteVehicle/plugin.cpp")
          target_include_directories(nte_vehicle PRIVATE "$root/include")
          target_compile_definitions(nte_vehicle PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          set_target_properties(nte_vehicle PROPERTIES OUTPUT_NAME "plugin" PREFIX "")
          "@ | Set-Content -LiteralPath "$src\CMakeLists.txt" -Encoding UTF8
          cmake -S $src -B $b -G "Visual Studio 17 2022" -A x64

      - name: Build NTE Vehicle
        shell: pwsh
        run: |
          $b = "$env:GITHUB_WORKSPACE\.build\nte-vehicle"
          cmake --build $b --config Release --parallel
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.8.1-windows-x64" | Out-Null
          Copy-Item "$b\Release\plugin.dll" "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.8.1-windows-x64\plugin.dll"
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteVehicle\manifest.json" "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.8.1-windows-x64\manifest.json"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.8.1-windows-x64\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.8.1-windows-x64.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteVehicle-0.8.1-windows-x64
          path: dist/NteVehicle-0.8.1-windows-x64.zip
          if-no-files-found: error
