name: nte-vehicle

on:
  push:
    branches:
      - nte-vehicle-final-20261004
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure Anomaly
        shell: pwsh
        run: cmake --preset windows-vs2022 -DANOMALY_BUILD_TEST_FIXTURES=OFF -DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF -DANOMALY_BUILD_TEST_PLUGINS=OFF

      - name: Build Anomaly runtime
        shell: pwsh
        run: cmake --build --preset windows-relwithdebinfo --parallel

      - name: Configure NTE Vehicle
        shell: pwsh
        run: |
          $b = "$env:GITHUB_WORKSPACE\.build\nte-vehicle"
          cmake -S "$env:GITHUB_WORKSPACE\plugins\NteVehicle" -B $b -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON

      - name: Build NTE Vehicle
        shell: pwsh
        run: |
          $b = "$env:GITHUB_WORKSPACE\.build\nte-vehicle"
          cmake --build $b --config Release --parallel
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64" | Out-Null
          Copy-Item "$b\Release\plugin.dll" "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64\plugin.dll"
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteVehicle\manifest.json" "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64\manifest.json"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteVehicle-0.7.0-windows-x64
          path: dist/NteVehicle-0.7.0-windows-x64.zip
          if-no-files-found: error
