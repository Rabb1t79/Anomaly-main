name: nte-vehicle

on:
  push:
    branches:
      - '**'
    paths:
      - 'plugins/NteVehicle/**'
      - 'include/anomaly/sdk/services/nte.h'
      - 'cmake/sdk/AnomalyPlugin.cmake'
      - 'sdk/cpp/plugin_cxx_throw_bridge.cpp'
      - '.github/workflows/nte-vehicle.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SDK-backed NTE Vehicle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE '.build/nte-vehicle-src'
          $b = Join-Path $env:GITHUB_WORKSPACE '.build/nte-vehicle'
          New-Item -ItemType Directory -Force $src | Out-Null
          @'
          cmake_minimum_required(VERSION 3.22)
          project(NteVehicleSDKConsumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          add_library(Anomaly::sdk INTERFACE IMPORTED GLOBAL)
          set_target_properties(Anomaly::sdk PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_SOURCE_DIR}/../../include"
              INTERFACE_COMPILE_FEATURES cxx_std_20)
          include("${CMAKE_CURRENT_SOURCE_DIR}/../../cmake/sdk/AnomalyPlugin.cmake")
          anomaly_add_plugin(nte_vehicle
              SOURCES "${CMAKE_CURRENT_SOURCE_DIR}/../../plugins/NteVehicle/plugin.cpp"
              MANIFEST "${CMAKE_CURRENT_SOURCE_DIR}/../../plugins/NteVehicle/manifest.json"
              PACKAGE_NAME NteVehicle
              OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/package/NteVehicle"
              NO_RELEASE)
          target_compile_definitions(nte_vehicle PRIVATE
              UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          '@ | Set-Content -LiteralPath (Join-Path $src 'CMakeLists.txt') -Encoding UTF8
          cmake -S $src -B $b -G "Visual Studio 17 2022" -A x64

      - name: Build and verify SDK exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b = Join-Path $env:GITHUB_WORKSPACE '.build/nte-vehicle'
          cmake --build $b --config Release --parallel
          $pkg = Join-Path $b 'package/NteVehicle'
          $dll = Join-Path $pkg 'plugin.dll'
          if (!(Test-Path $dll)) { throw 'SDK package did not produce plugin.dll' }
          if (!(Test-Path (Join-Path $pkg 'manifest.json'))) { throw 'SDK package did not contain manifest.json' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'Cannot locate Visual Studio installation for export verification' }
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (!$vs) { throw 'Visual Studio installation path is unavailable' }
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$dumpbin) { throw 'MSVC dumpbin.exe was not found' }
          $exports = & $dumpbin /nologo /exports $dll 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed to read plugin exports' }
          $exportText = $exports -join "`n"
          if ($exportText -notmatch 'AnomalyPluginEntryV1') { throw 'plugin.dll is missing AnomalyPluginEntryV1' }
          if ($exportText -notmatch 'AnomalyPluginCxxThrowV1') { throw 'plugin.dll is missing AnomalyPluginCxxThrowV1' }

          $out = Join-Path $env:GITHUB_WORKSPACE 'dist/NteVehicle-0.9.6-windows-x64.zip'
          New-Item -ItemType Directory -Force (Split-Path $out -Parent) | Out-Null
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath $out -Force
          Get-FileHash $out -Algorithm SHA256 | Format-List

      - name: Upload verified SDK plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteVehicle-0.9.6-SDK-windows-x64
          path: dist/NteVehicle-0.9.6-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
