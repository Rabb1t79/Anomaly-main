name: nte-vehicle

on:
  push:
    branches:
      - nte-vehicle-final-20261004
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure Anomaly
        shell: pwsh
        run: cmake --preset windows-vs2022 -DANOMALY_BUILD_TEST_FIXTURES=OFF -DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF -DANOMALY_BUILD_TEST_PLUGINS=OFF

      - name: Build NTE Vehicle
        shell: pwsh
        run: |
          cmake --build --preset windows-relwithdebinfo --target anomaly_builtin_nte_vehicle --parallel
          $out = "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64"
          $src = "$env:GITHUB_WORKSPACE\.build\windows-vs2022\bin\RelWithDebInfo\builtin-plugins\NteVehicle"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$src\plugin.dll" "$out\plugin.dll"
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteVehicle\manifest.json" "$out\manifest.json"
          if (-not (Test-Path "$out\plugin.dll")) { throw "plugin.dll missing" }
          if (-not (Test-Path "$out\manifest.json")) { throw "manifest.json missing" }
          $files = Get-ChildItem -LiteralPath $out -File
          if ($files.Count -ne 2 -or ($files.Name -notcontains "plugin.dll") -or ($files.Name -notcontains "manifest.json")) { throw "Output folder must contain exactly plugin.dll and manifest.json" }
          Compress-Archive -Path "$out\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\NteVehicle-0.7.0-windows-x64.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteVehicle-0.7.0-windows-x64
          path: dist/NteVehicle-0.7.0-windows-x64.zip
          if-no-files-found: error
