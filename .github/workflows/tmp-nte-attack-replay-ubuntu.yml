name: tmp AttackReplay Ubuntu cross-build

on:
  push:
    branches:
      - work/nte-attack-replay-plugin-20261008
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install LLVM-MinGW 20260922 MSVCRT
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-msvcrt-ubuntu-22.04-x86_64.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
      - name: Compile plugin
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$GITHUB_WORKSPACE/Anomaly-2.0.0-sdk/include"
          SRC="$GITHUB_WORKSPACE/plugins/NteAttackReplay/plugin.cpp"
          OUT="$GITHUB_WORKSPACE/NteAttackReplay-plugin.dll"
          "$RUNNER_TEMP/llvm-mingw/bin/clang++.exe" --version
          "$RUNNER_TEMP/llvm-mingw/bin/clang++.exe" \
            -target x86_64-w64-windows-gnu \
            -std=c++20 -O2 -DNOMINMAX -DWIN32_LEAN_AND_MEAN \
            "-I$SDK" -shared "$SRC" -o "$OUT"
          test -s "$OUT"
          file "$OUT"
