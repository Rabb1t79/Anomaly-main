name: attack-replay-build
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/nte-attack-replay]
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\.build\attack-replay"
          $s="$env:GITHUB_WORKSPACE\.build\attack-replay-src"
          New-Item -ItemType Directory -Force $s | Out-Null
          @"
          cmake_minimum_required(VERSION 3.22)
          project(NteAttackReplayStandalone LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(nte_attack_replay SHARED "$env:GITHUB_WORKSPACE/plugins/NteAttackReplay/plugin.cpp")
          target_include_directories(nte_attack_replay PRIVATE "$env:GITHUB_WORKSPACE/include")
          target_compile_definitions(nte_attack_replay PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          set_target_properties(nte_attack_replay PROPERTIES OUTPUT_NAME "plugin" PREFIX "")
          "@ | Set-Content -LiteralPath "$s\CMakeLists.txt" -Encoding UTF8
          cmake -S $s -B $b -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: |
          $b="$env:GITHUB_WORKSPACE\.build\attack-replay"
          cmake --build $b --config Release --parallel 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist\NteAttackReplay-1.1.0-windows-x64" | Out-Null
          Copy-Item "$b\Release\plugin.dll" "$env:GITHUB_WORKSPACE\dist\NteAttackReplay-1.1.0-windows-x64\plugin.dll"
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteAttackReplay\manifest.json" "$env:GITHUB_WORKSPACE\dist\NteAttackReplay-1.1.0-windows-x64\manifest.json"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\NteAttackReplay-1.1.0-windows-x64\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\NteAttackReplay-1.1.0-windows-x64.zip" -Force
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-1.1.0-windows-x64
          path: dist/NteAttackReplay-1.1.0-windows-x64.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-build-log
          path: build.log
          if-no-files-found: warn
