name: nte-attack-replay-check
on:
  push:
    branches: [feature/nte-attack-replay]
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-vs2022
      - name: Build plugin
        run: cmake --build .build/windows-vs2022 --config RelWithDebInfo --target anomaly_builtin_nte_attack_replay --parallel
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-fixed
          path: .build/windows-vs2022/package/NteAttackReplay
          if-no-files-found: error
