name: NTE damage-chain Core validation

on:
  push:
    branches:
      - work/nte-damage-chain-reaction-independent-20261018
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'include/anomaly/**'
      - 'src/game/**'
      - 'src/runtime/**'
      - 'src/plugin/**'
      - 'profiles/nte/**'
      - 'abi/**'
      - 'apps/abi_snapshot/**'
      - 'plugins/DamageChainReaction/**'
      - 'Anomaly-2.0.0-sdk/**'
      - '.github/workflows/nte-damage-chain-core.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'include/anomaly/**'
      - 'src/game/**'
      - 'src/runtime/**'
      - 'src/plugin/**'
      - 'profiles/nte/**'
      - 'abi/**'
      - 'apps/abi_snapshot/**'
      - 'plugins/DamageChainReaction/**'
      - 'Anomaly-2.0.0-sdk/**'
      - '.github/workflows/nte-damage-chain-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-validation:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout PR head (not synthetic merge tree)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Core and ABI validation
        shell: pwsh
        run: |
          cmake --preset windows-vs2022 -DANOMALY_BUILD_TEST_FIXTURES=OFF -DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF -DANOMALY_BUILD_TEST_PLUGINS=OFF

      - name: Build Core and ABI snapshot tool
        run: cmake --build --preset windows-relwithdebinfo --target anomaly_core anomaly_abi_snapshot --parallel 4

      - name: Generate and validate ABI snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = Join-Path $env:GITHUB_WORKSPACE '.build/windows-vs2022/bin/RelWithDebInfo/anomaly-abi-snapshot.exe'
          if (!(Test-Path $snapshot)) { throw "ABI snapshot tool was not built: $snapshot" }
          $generated = Join-Path $env:RUNNER_TEMP 'nte-damage-chain-generated-abi.json'
          & $snapshot --write $generated
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate ABI snapshot from the built SDK.' }
          # The previous checker only compared a generated file to itself; parse it too,
          # so malformed JSON (including trailing commas) cannot pass as a valid ABI.
          Get-Content -LiteralPath $generated -Raw | ConvertFrom-Json | Out-Null
          & $snapshot --check $generated
          if ($LASTEXITCODE -ne 0) { throw 'Generated ABI snapshot did not validate.' }
          # Temporary export for synchronizing the checked-in ABI manifests from this build.
          $snapshotText = [IO.File]::ReadAllText($generated)
          $snapshotBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($snapshotText))
          for ($offset = 0; $offset -lt $snapshotBase64.Length; $offset += 2000) {
            $length = [Math]::Min(2000, $snapshotBase64.Length - $offset)
            Write-Host ("ABIJSON_B64:{0}:{1}" -f $offset, $snapshotBase64.Substring($offset, $length))
          }

      - name: Upload Core and ABI snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nte-damage-chain-core-validation
          path: |
            .build/windows-vs2022/bin/RelWithDebInfo/Anomaly.Core.dll
            .build/windows-vs2022/bin/RelWithDebInfo/anomaly-abi-snapshot.exe
            ${{ runner.temp }}/nte-damage-chain-generated-abi.json
          if-no-files-found: error
          retention-days: 7
