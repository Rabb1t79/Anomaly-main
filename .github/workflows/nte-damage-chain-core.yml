name: NTE damage-chain Core validation

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'include/anomaly/**'
      - 'src/game/**'
      - 'src/runtime/**'
      - 'src/plugin/**'
      - 'plugins/DamageChain/**'
      - 'docs/api-reference/manifest-and-capabilities.md'
      - 'docs/developer-guide/damage-chain-queued-service.md'
      - 'profiles/nte/**'
      - 'abi/**'
      - 'Anomaly-2.0.0-sdk/**'
      - '.github/workflows/nte-damage-chain-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-validation:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout PR head (not synthetic merge tree)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Core and ABI validation
        shell: pwsh
        run: |
          cmake --preset windows-vs2022 -DANOMALY_BUILD_TEST_FIXTURES=OFF -DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF -DANOMALY_BUILD_TEST_PLUGINS=OFF -DANOMALY_BUILD_BUILTIN_PLUGINS=ON

      - name: Build Core and ABI snapshot tool
        run: cmake --build --preset windows-relwithdebinfo --target anomaly_core anomaly_abi_snapshot anomaly_builtin_damage_chain --parallel 4

      - name: Generate and validate ABI snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = Join-Path $env:GITHUB_WORKSPACE '.build/windows-vs2022/bin/RelWithDebInfo/anomaly-abi-snapshot.exe'
          if (!(Test-Path $snapshot)) { throw "ABI snapshot tool was not built: $snapshot" }
          $generated = Join-Path $env:RUNNER_TEMP 'nte-damage-chain-generated-abi.json'
          & $snapshot --write $generated
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate ABI snapshot from the built SDK.' }
          & $snapshot --check $generated
          if ($LASTEXITCODE -ne 0) { throw 'Generated ABI snapshot did not validate.' }

      - name: Validate and package Damage Chain plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE '.build/windows-vs2022/bin/RelWithDebInfo/builtin-plugins/DamageChain'
          $dll = Join-Path $package 'plugin.dll'
          $manifest = Join-Path $package 'manifest.json'
          if (!(Test-Path $dll)) { throw "Damage Chain DLL was not built: $dll" }
          if (!(Test-Path $manifest)) { throw "Damage Chain manifest was not staged: $manifest" }
          $entry = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($entry.id -ne 'anomaly.builtin.damage-chain') { throw "Unexpected plugin id: $($entry.id)" }
          if ($entry.version -ne '1.0.0') { throw "Unexpected Damage Chain version: $($entry.version)" }
          if (!($entry.services.id -contains 'anomaly.nte.damage-chain')) { throw 'New native damage-chain service is not declared in the manifest' }
          $expected = @('manifest.json', 'plugin.dll')
          $actual = @(Get-ChildItem -LiteralPath $package -File | ForEach-Object { $_.Name } | Sort-Object)
          if (($actual -join ',') -ne (($expected | Sort-Object) -join ',')) { throw "Unexpected package files: $($actual -join ',')" }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $zip = Join-Path $dist 'DamageChain-windows-x64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -Force
          $verify = Join-Path $env:RUNNER_TEMP 'damage-chain-package-verify'
          if (Test-Path $verify) { Remove-Item -LiteralPath $verify -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $verify
          $verified = @(Get-ChildItem -LiteralPath $verify -File | ForEach-Object { $_.Name } | Sort-Object)
          if (($verified -join ',') -ne (($expected | Sort-Object) -join ',')) { throw "Invalid zip contents: $($verified -join ',')" }

      - name: Upload Core, ABI and plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nte-damage-chain-core-validation
          path: |
            .build/windows-vs2022/bin/RelWithDebInfo/Anomaly/Anomaly.Core.dll
            .build/windows-vs2022/bin/RelWithDebInfo/anomaly-abi-snapshot.exe
            dist/DamageChain-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
