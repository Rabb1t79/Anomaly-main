name: export merged source main
on:
  push:
    branches:
      - main
jobs:
  export:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'merged-source'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $files = @(
            'plugins/NteAttackReplay/plugin.cpp',
            'plugins/NteAttackReplay/manifest.json',
            'plugins/NteVehicle/plugin.cpp',
            'plugins/NteVehicle/manifest.json',
            'src/game/ue5/ue5_nte_adapter.cpp',
            'Anomaly-2.0.0-sdk/include/anomaly/sdk/services/nte.h'
          )
          foreach ($f in $files) {
            if (Test-Path (Join-Path $env:GITHUB_WORKSPACE $f)) {
              $dst = Join-Path $root $f
              New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
              Copy-Item (Join-Path $env:GITHUB_WORKSPACE $f) $dst
            }
          }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'merged-source.zip') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: merged-source-main
          path: merged-source.zip
