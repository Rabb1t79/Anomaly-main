name: windows-core-and-nte-profile

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-core:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            '-DANOMALY_BUILD_TEST_FIXTURES=OFF',
            '-DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF',
            '-DANOMALY_BUILD_TEST_PLUGINS=OFF'
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Core only
        shell: pwsh
        run: |
          cmake --build --preset windows-relwithdebinfo --target anomaly_core --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $pattern = '(error C[0-9]+|fatal error|LNK[0-9]{4}|error MSB[0-9]+|CMake Error|Error copying directory)'
          $emitted = 0
          foreach ($file in @('build.log', 'configure.log')) {
            if (-not (Test-Path $file)) { continue }
            Get-Content $file | Where-Object { $_ -match $pattern } | Select-Object -First 30 | ForEach-Object {
              Write-Host "::error::$($_)"
              $emitted++
            }
          }
          if ($emitted -eq 0) {
            Write-Host "::error::No matching compiler/configuration error lines; last 35 lines of available logs follow."
            foreach ($file in @('build.log', 'configure.log')) {
              if (Test-Path $file) {
                Get-Content $file -Tail 35 | ForEach-Object { Write-Host "::error::$($_)" }
              }
            }
          }

      - name: Prepare Core and NTE vehicle profile patch
        shell: pwsh
        run: |
          $core = Join-Path $env:GITHUB_WORKSPACE '.build\windows-vs2022\bin\RelWithDebInfo\Anomaly\Anomaly.Core.dll'
          $profile = Join-Path $env:GITHUB_WORKSPACE 'profiles\nte\nte-current.json'
          if (!(Test-Path -LiteralPath $core)) {
            throw "Core DLL was not produced: $core"
          }
          if (!(Test-Path -LiteralPath $profile)) {
            throw "NTE Profile was not found: $profile"
          }
          $parsed = Get-Content -LiteralPath $profile -Raw | ConvertFrom-Json
          if (-not $parsed.features.'nte.vehicle') {
            throw "The NTE Profile does not declare nte.vehicle"
          }
          $out = Join-Path $env:GITHUB_WORKSPACE '.build\runtime-vehicle-service-patch'
          $anomaly = Join-Path $out 'Anomaly'
          $profileDir = Join-Path $anomaly 'profiles\nte'
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          Copy-Item -LiteralPath $core -Destination (Join-Path $anomaly 'Anomaly.Core.dll') -Force
          Copy-Item -LiteralPath $profile -Destination (Join-Path $profileDir 'nte-current.json') -Force
          @'
          Anomaly vehicle-service compatibility patch

          Contents:
          - Anomaly/Anomaly.Core.dll
          - Anomaly/profiles/nte/nte-current.json

          Installation:
          1. Exit the game and Anomaly Runtime completely.
          2. Back up the existing Anomaly/Anomaly.Core.dll and Anomaly/profiles/nte/nte-current.json.
          3. Copy the Anomaly folder from this package into the existing Runtime directory and overwrite those two files.
          4. Start the game again and check whether the vehicle plugin still reports "waiting for service".

          This is a two-file compatibility patch, not a full Runtime distribution.
          '@ | Set-Content -LiteralPath (Join-Path $out 'INSTALL.txt') -Encoding utf8
          Get-ChildItem -LiteralPath $out -Recurse -File | Select-Object FullName, Length

      - name: Upload Core and NTE vehicle profile patch
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-vehicle-service-core-profile-patch
          path: .build/runtime-vehicle-service-patch/*
          if-no-files-found: error