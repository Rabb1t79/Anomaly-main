name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: Also build the development fixtures, diagnostic probes and test plugin packages
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        env:
          # Fixtures, diagnostic probes and test plugin packages are opt-in; a normal run
          # builds only the Runtime, Tools and SDK targets.
          ANOMALY_BUILD_OPTIONAL: ${{ inputs.fixtures == true && 'ON' || 'OFF' }}
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            "-DANOMALY_BUILD_TEST_FIXTURES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_DIAGNOSTIC_PROBES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_TEST_PLUGINS=$env:ANOMALY_BUILD_OPTIONAL"
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Stage CI runtime and tools
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component GameRuntime
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/tools --component Tools
      - name: Build and stage NTE Vehicle and Attack Replay
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE -replace '\\', '/'
          foreach ($plugin in @('NteVehicle', 'NteAttackReplay')) {
            $src = Join-Path $env:GITHUB_WORKSPACE ".build/plugin-src/$plugin"
            $b = Join-Path $env:GITHUB_WORKSPACE ".build/plugin-build/$plugin"
            New-Item -ItemType Directory -Path $src -Force | Out-Null
            @"
          cmake_minimum_required(VERSION 3.22)
          project($($plugin)Standalone LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library($($plugin.ToLower()) SHARED "$root/plugins/$plugin/plugin.cpp")
          target_include_directories($($plugin.ToLower()) PRIVATE "$root/include")
          target_compile_definitions($($plugin.ToLower()) PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          set_target_properties($($plugin.ToLower()) PROPERTIES OUTPUT_NAME "plugin" PREFIX "")
          "@ | Set-Content -LiteralPath (Join-Path $src 'CMakeLists.txt') -Encoding UTF8
            cmake -S $src -B $b -G "Visual Studio 17 2022" -A x64
            cmake --build $b --config Release --parallel
            $dll = Join-Path $b 'Release/plugin.dll'
            if (!(Test-Path $dll)) { throw "$plugin plugin.dll was not produced" }
            $pkg = Join-Path $env:GITHUB_WORKSPACE ".build/ci-artifacts/runtime/Anomaly/plugins/$plugin"
            New-Item -ItemType Directory -Path $pkg -Force | Out-Null
            Copy-Item $dll (Join-Path $pkg 'plugin.dll') -Force
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "plugins/$plugin/manifest.json") (Join-Path $pkg 'manifest.json') -Force
            $locales = Join-Path $env:GITHUB_WORKSPACE "plugins/$plugin/locales"
            if (Test-Path $locales) { Copy-Item $locales $pkg -Recurse -Force }
          }
      - name: Stage CI test plugins
        if: github.ref_type != 'tag' && inputs.fixtures == true
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component TestPlugins
      - name: Upload CI runtime
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-runtime-windows-x64
          path: .build/ci-artifacts/runtime
          if-no-files-found: error
      - name: Upload CI tools
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-tools-windows-x64
          path: .build/ci-artifacts/tools
          if-no-files-found: error
      - name: Package runtime, tools and SDK
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
      - name: Publish runtime, tools and SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
