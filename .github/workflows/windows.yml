name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: Also build the development fixtures, diagnostic probes and test plugin packages
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        env:
          # Fixtures, diagnostic probes and test plugin packages are opt-in; a normal run
          # builds only the Runtime, Tools and SDK targets.
          ANOMALY_BUILD_OPTIONAL: ${{ inputs.fixtures == true && 'ON' || 'OFF' }}
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            "-DANOMALY_BUILD_TEST_FIXTURES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_DIAGNOSTIC_PROBES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_TEST_PLUGINS=$env:ANOMALY_BUILD_OPTIONAL"
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Stage CI runtime and tools
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component GameRuntime
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/tools --component Tools
      - name: Stage CI test plugins
        if: github.ref_type != 'tag' && inputs.fixtures == true
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component TestPlugins
      - name: Upload CI runtime
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-runtime-windows-x64
          path: .build/ci-artifacts/runtime
          if-no-files-found: error
      - name: Upload CI tools
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-tools-windows-x64
          path: .build/ci-artifacts/tools
          if-no-files-found: error
      - name: Package runtime, tools and SDK
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          if-no-files-found: error
  attack_replay:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/attack-replay-native-abi-20261005'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM-MinGW 20260922 MSVCRT
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-msvcrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Configure and build NteAttackReplay
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/NteAttackReplay-NoVS -B tools/NteAttackReplay-NoVS/out/build             -G "Unix Makefiles"             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/NteAttackReplay-NoVS/llvm-mingw-toolchain.cmake"             -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/Anomaly-2.0.0-sdk"             -DAnomalySDK_DIR="$GITHUB_WORKSPACE/Anomaly-2.0.0-sdk/lib/cmake/AnomalySDK"             -DANOMALY_SOURCE_ROOT="$GITHUB_WORKSPACE"
          cmake --build tools/NteAttackReplay-NoVS/out/build --target anomaly_nte_attack_replay --parallel 2
      - name: Package NteAttackReplay
        shell: bash
        run: |
          set -euo pipefail
          pkg="$GITHUB_WORKSPACE/tools/NteAttackReplay-NoVS/out/NteAttackReplay"
          mkdir -p "$pkg"
          cp "$GITHUB_WORKSPACE/tools/NteAttackReplay-NoVS/out/build/package/NteAttackReplay/plugin.dll" "$pkg/plugin.dll"
          cp "$GITHUB_WORKSPACE/plugins/NteAttackReplay/manifest.json" "$pkg/manifest.json"
          for dll in libc++.dll libc++abi.dll libunwind.dll; do
            if [ -f "$LLVM_MINGW_ROOT/bin/$dll" ]; then cp "$LLVM_MINGW_ROOT/bin/$dll" "$pkg/$dll"; fi
          done
          (cd "$pkg" && zip -r "$GITHUB_WORKSPACE/NteAttackReplay-NoVS-LLVM.zip" .)
      - name: Upload NteAttackReplay
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-NoVS-LLVM
          path: NteAttackReplay-NoVS-LLVM.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
      - name: Publish runtime, tools and SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
