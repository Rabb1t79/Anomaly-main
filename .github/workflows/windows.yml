name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: Also build the development fixtures, diagnostic probes and test plugin packages
        type: boolean
        default: false

jobs:
  build:
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        env:
          # Fixtures, diagnostic probes and test plugin packages are opt-in; a normal run
          # builds Runtime, Tools, SDK, and the two supported NTE plugin packages.
          ANOMALY_BUILD_OPTIONAL: ${{ inputs.fixtures == true && 'ON' || 'OFF' }}
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            "-DANOMALY_BUILD_TEST_FIXTURES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_DIAGNOSTIC_PROBES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_TEST_PLUGINS=$env:ANOMALY_BUILD_OPTIONAL"
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel 4
      - name: Validate ABI snapshot and packaged SDK interfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = Join-Path $env:GITHUB_WORKSPACE '.build/windows-vs2022/bin/RelWithDebInfo/anomaly-abi-snapshot.exe'
          if (!(Test-Path $snapshot)) { throw "ABI snapshot tool was not built: $snapshot" }
          foreach ($relative in @(
            'abi/anomaly-sdk-v1-windows-x64.json',
            'Anomaly-2.0.0-sdk/share/anomaly/abi/anomaly-sdk-v1-windows-x64.json'
          )) {
            & $snapshot --check (Join-Path $env:GITHUB_WORKSPACE $relative)
            if ($LASTEXITCODE -ne 0) { throw "ABI snapshot mismatch: $relative" }
          }
          foreach ($relative in @('services/nte.h', 'services/ui.h')) {
            $source = Join-Path $env:GITHUB_WORKSPACE ("include/anomaly/sdk/" + $relative)
            $packaged = Join-Path $env:GITHUB_WORKSPACE ("Anomaly-2.0.0-sdk/include/anomaly/sdk/" + $relative)
            $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $packagedHash = (Get-FileHash -LiteralPath $packaged -Algorithm SHA256).Hash
            if ($sourceHash -ne $packagedHash) { throw "SDK header drift: $relative" }
          }
      - name: Stage CI runtime and tools
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimePrefix = '.build/ci-artifacts/runtime'
          $toolsPrefix = '.build/ci-artifacts/tools'
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix $runtimePrefix --component GameRuntime
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix $toolsPrefix --component Tools
          # The 5.6.1/CppSDK dump is external validation evidence, never a Runtime/Tools payload.
          foreach ($prefix in @($runtimePrefix, $toolsPrefix)) {
            $stageRoot = Join-Path $env:GITHUB_WORKSPACE $prefix
            $dumpPayload = @(Get-ChildItem -LiteralPath $stageRoot -Force -Recurse | Where-Object {
              $relative = [IO.Path]::GetRelativePath($stageRoot, $_.FullName)
              $relative -match '(?i)(^|[\\/])(5\.6\.1|CppSDK|dumps?)([\\/]|$)'
            })
            if ($dumpPayload.Count -gt 0) {
              $paths = $dumpPayload | ForEach-Object { [IO.Path]::GetRelativePath($stageRoot, $_.FullName) }
              throw 'Game dump content is forbidden in CI package: ' + ($paths -join ', ')
            }
          }
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE '.build/ci-artifacts/runtime/Anomaly'
          if (!(Test-Path $runtimeRoot)) { throw 'Runtime staging root did not contain the expected Anomaly directory.' }
          if (!(Test-Path (Join-Path $runtimeRoot 'Anomaly.Core.dll'))) { throw 'Runtime staging is missing the Core built from this commit.' }
          $expectedPlugins = @(
            @{ Name = 'AutoFish'; Id = 'b1ank.autofish'; Version = '0.1.15' },
            @{ Name = 'NteVehicle'; Id = 'anomaly.local.nte-vehicle'; Version = '0.9.9' },
            @{ Name = 'NteAttackReplay'; Id = 'anomaly.builtin.nte-attack-replay'; Version = '1.9.5' }
          )
          foreach ($plugin in $expectedPlugins) {
            $pluginRoot = Join-Path $runtimeRoot ("plugins/" + $plugin.Name)
            $dll = Join-Path $pluginRoot 'plugin.dll'
            $manifestPath = Join-Path $pluginRoot 'manifest.json'
            if (!(Test-Path $dll) -or !(Test-Path $manifestPath)) { throw "Incomplete current-build plugin package: $($plugin.Name)" }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.id -ne $plugin.Id -or $manifest.version -ne $plugin.Version -or $manifest.entry -ne 'plugin.dll') {
              throw "Manifest mismatch in current-build plugin package: $($plugin.Name)"
            }
          }
      - name: Stage CI test plugins
        if: github.ref_type != 'tag' && inputs.fixtures == true
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component TestPlugins
      - name: Upload CI runtime
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-runtime-windows-x64
          path: .build/ci-artifacts/runtime
          if-no-files-found: error
      - name: Upload CI tools
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-tools-windows-x64
          path: .build/ci-artifacts/tools
          if-no-files-found: error
      - name: Package runtime, tools and SDK
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
      - name: Publish runtime, tools and SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
