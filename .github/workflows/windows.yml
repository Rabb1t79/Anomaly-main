name: windows-core

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-core:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            '-DANOMALY_BUILD_TEST_FIXTURES=OFF',
            '-DANOMALY_BUILD_DIAGNOSTIC_PROBES=OFF',
            '-DANOMALY_BUILD_TEST_PLUGINS=OFF'
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Core only
        shell: pwsh
        run: |
          cmake --build --preset windows-relwithdebinfo --target anomaly_core --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $pattern = '(error C[0-9]+|fatal error|LNK[0-9]{4}|error MSB[0-9]+|CMake Error|Error copying directory)'
          $emitted = 0
          foreach ($file in @('build.log', 'configure.log')) {
            if (-not (Test-Path $file)) { continue }
            Get-Content $file | Where-Object { $_ -match $pattern } | Select-Object -First 30 | ForEach-Object {
              Write-Host "::error::$($_)"
              $emitted++
            }
          }
          if ($emitted -eq 0) {
            Write-Host "::error::No matching compiler/configuration error lines; last 35 lines of available logs follow."
            foreach ($file in @('build.log', 'configure.log')) {
              if (Test-Path $file) {
                Get-Content $file -Tail 35 | ForEach-Object { Write-Host "::error::$($_)" }
              }
            }
          }

      - name: Prepare Core artifact
        shell: pwsh
        run: |
          $core = Join-Path $env:GITHUB_WORKSPACE '.build\windows-vs2022\bin\RelWithDebInfo\Anomaly\Anomaly.Core.dll'
          if (!(Test-Path -LiteralPath $core)) {
            throw "Core DLL was not produced: $core"
          }
          $out = Join-Path $env:GITHUB_WORKSPACE '.build\core-artifact'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath $core -Destination (Join-Path $out 'Anomaly.Core.dll') -Force

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-core-windows-x64
          path: .build/core-artifact/Anomaly.Core.dll
          if-no-files-found: error
