name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: Also build the development fixtures, diagnostic probes and test plugin packages
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        env:
          # Fixtures, diagnostic probes and test plugin packages are opt-in; a normal run
          # builds Runtime, Tools, SDK, and the two supported NTE plugin packages.
          ANOMALY_BUILD_OPTIONAL: ${{ inputs.fixtures == true && 'ON' || 'OFF' }}
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            "-DANOMALY_BUILD_TEST_FIXTURES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_DIAGNOSTIC_PROBES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_TEST_PLUGINS=$env:ANOMALY_BUILD_OPTIONAL"
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows-relwithdebinfo --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $emitted = 0
          foreach ($file in @('build.log', 'configure.log')) {
            if (-not (Test-Path $file)) { continue }
            $lines = Get-Content $file -Tail 80
            foreach ($line in $lines) {
              if ($emitted -ge 30) { break }
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              Write-Host "::error::$line"
              $emitted++
            }
          }
          if ($emitted -eq 0) {
            Write-Host "::error::no build.log captured; listing .build"
            if (Test-Path .build) { Get-ChildItem .build -Depth 1 | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName } }
          }

      - name: Build NTE Vehicle and Attack Replay plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE '.build/nte-runtime-plugins-src'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE '.build/nte-runtime-plugins'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          $cmakeLists = @'
          cmake_minimum_required(VERSION 3.22)
          project(AnomalyNteRuntimePlugins LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(ANOMALY_SOURCE_ROOT "@ROOT@")
          if(EXISTS "${ANOMALY_SOURCE_ROOT}/plugins/NteVehicle/plugin.cpp")
            add_library(nte_vehicle SHARED "${ANOMALY_SOURCE_ROOT}/plugins/NteVehicle/plugin.cpp")
          endif()
          if(EXISTS "${ANOMALY_SOURCE_ROOT}/plugins/NteAttackReplay/plugin.cpp")
            add_library(nte_attack_replay SHARED "${ANOMALY_SOURCE_ROOT}/plugins/NteAttackReplay/plugin.cpp")
          endif()
          if(EXISTS "${ANOMALY_SOURCE_ROOT}/plugins/AnomalyUltimate/plugin.cpp")
            add_library(anomaly_ultimate SHARED "${ANOMALY_SOURCE_ROOT}/plugins/AnomalyUltimate/plugin.cpp")
          endif()
          if(EXISTS "${ANOMALY_SOURCE_ROOT}/plugins/AnomalyDamageChain/plugin.cpp")
            add_library(anomaly_damage_chain SHARED "${ANOMALY_SOURCE_ROOT}/plugins/AnomalyDamageChain/plugin.cpp")
          endif()
          foreach(target IN ITEMS nte_vehicle nte_attack_replay anomaly_ultimate anomaly_damage_chain)
            if(TARGET ${target})
              target_include_directories(${target} PRIVATE "${ANOMALY_SOURCE_ROOT}/include")
              target_compile_definitions(${target} PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
              set_target_properties(${target} PROPERTIES OUTPUT_NAME "plugin" PREFIX "")
            endif()
          endforeach()
          if(TARGET nte_vehicle)
            set_target_properties(nte_vehicle PROPERTIES
              RUNTIME_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/NteVehicle"
              LIBRARY_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/NteVehicle")
          endif()
          if(TARGET nte_attack_replay)
            set_target_properties(nte_attack_replay PROPERTIES
              RUNTIME_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/NteAttackReplay"
              LIBRARY_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/NteAttackReplay")
          endif()
          if(TARGET anomaly_ultimate)
            set_target_properties(anomaly_ultimate PROPERTIES
              RUNTIME_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/AnomalyUltimate"
              LIBRARY_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/AnomalyUltimate")
          endif()
          if(TARGET anomaly_damage_chain)
            set_target_properties(anomaly_damage_chain PROPERTIES
              RUNTIME_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/AnomalyDamageChain"
              LIBRARY_OUTPUT_DIRECTORY_RELEASE "${CMAKE_BINARY_DIR}/out/AnomalyDamageChain")
          endif()
          '@
          $cmakeLists = $cmakeLists.Replace('@ROOT@', $root)
          Set-Content -LiteralPath (Join-Path $sourceDir 'CMakeLists.txt') -Value $cmakeLists -Encoding UTF8
          cmake -S $sourceDir -B $buildDir -G "Visual Studio 17 2022" -A x64
          cmake --build $buildDir --config Release --parallel
          $checks = @(
            @('NteVehicle', (Join-Path $buildDir 'out/NteVehicle/plugin.dll')),
            @('NteAttackReplay', (Join-Path $buildDir 'out/NteAttackReplay/plugin.dll')),
            @('AnomalyUltimate', (Join-Path $buildDir 'out/AnomalyUltimate/plugin.dll')),
            @('AnomalyDamageChain', (Join-Path $buildDir 'out/AnomalyDamageChain/plugin.dll'))
          )
          foreach ($check in $checks) {
            $name = $check[0]
            $dll = $check[1]
            $source = Join-Path $env:GITHUB_WORKSPACE ("plugins/" + $name + "/plugin.cpp")
            if ((Test-Path $source) -and -not (Test-Path $dll)) {
              throw "$name plugin.dll was not produced: $dll"
            }
          }
      - name: Stage CI runtime and tools
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component GameRuntime
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/tools --component Tools
          $pluginsRoot = Join-Path $env:GITHUB_WORKSPACE '.build/ci-artifacts/runtime/Anomaly/plugins'
          if (!(Test-Path (Join-Path $env:GITHUB_WORKSPACE '.build/ci-artifacts/runtime/Anomaly'))) {
            throw 'Runtime staging root did not contain the expected Anomaly directory.'
          }
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE '.build/nte-runtime-plugins/out'
          $packages = @(
            @{ Name = 'NteVehicle'; Source = (Join-Path $buildRoot 'NteVehicle/plugin.dll'); Manifest = (Join-Path $env:GITHUB_WORKSPACE 'plugins/NteVehicle/manifest.json') },
            @{ Name = 'NteAttackReplay'; Source = (Join-Path $buildRoot 'NteAttackReplay/plugin.dll'); Manifest = (Join-Path $env:GITHUB_WORKSPACE 'plugins/NteAttackReplay/manifest.json') },
            @{ Name = 'AnomalyUltimate'; Source = (Join-Path $buildRoot 'AnomalyUltimate/plugin.dll'); Manifest = (Join-Path $env:GITHUB_WORKSPACE 'plugins/AnomalyUltimate/manifest.json') },
            @{ Name = 'AnomalyDamageChain'; Source = (Join-Path $buildRoot 'AnomalyDamageChain/plugin.dll'); Manifest = (Join-Path $env:GITHUB_WORKSPACE 'plugins/AnomalyDamageChain/manifest.json') }
          )
          foreach ($package in $packages) {
            $destination = Join-Path $pluginsRoot $package.Name
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -LiteralPath $package.Source -Destination (Join-Path $destination 'plugin.dll') -Force
            Copy-Item -LiteralPath $package.Manifest -Destination (Join-Path $destination 'manifest.json') -Force
            if (!(Test-Path (Join-Path $destination 'plugin.dll')) -or !(Test-Path (Join-Path $destination 'manifest.json'))) {
              throw "Incomplete staged plugin package: $($package.Name)"
            }
          }
      - name: Stage CI test plugins
        if: github.ref_type != 'tag' && inputs.fixtures == true
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component TestPlugins
      - name: Upload CI runtime
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-runtime-windows-x64
          path: .build/ci-artifacts/runtime
          if-no-files-found: error
      - name: Upload CI tools
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-tools-windows-x64
          path: .build/ci-artifacts/tools
          if-no-files-found: error
      - name: Package runtime, tools and SDK
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
      - name: Publish runtime, tools and SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
