name: Legacy plugin DLL static triage

on:
  push:
    branches:
      - recovery/analyze-old-plugin-dll-20261017
    paths:
      - 'tools/legacy-plugin-triage.py'
      - '.github/workflows/legacy-plugin-triage.yml'
      - 'plugins/TimeAccel/plugin_old.dll'

permissions:
  contents: read

jobs:
  triage:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record repository file identity and inspect PE statically
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          python --version
          python tools/legacy-plugin-triage.py

      - name: Upload original legacy DLL for offline analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-plugin-source-binary
          path: plugins/TimeAccel/plugin_old.dll
          if-no-files-found: error
          retention-days: 14

      - name: Upload static triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-plugin-static-triage
          path: |
            legacy-plugin-triage.txt
            legacy-plugin-triage.json
          if-no-files-found: error
          retention-days: 14
