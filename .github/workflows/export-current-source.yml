name: Export current source snapshot
on:
  push:
    branches:
      - work/nte-attack-replay-plugin-20261008
  pull_request:
    branches:
      - main
jobs:
  export:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Archive source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git archive --format=zip --output=current-source.zip HEAD
          if (!(Test-Path current-source.zip)) { throw 'source archive was not produced' }
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Anomaly-main-current-source
          path: current-source.zip
          if-no-files-found: error
