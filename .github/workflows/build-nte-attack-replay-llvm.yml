name: Build NteAttackReplay LLVM MinGW

on:
  push:
    branches:
      - nte-attack-replay-novs-20261004
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install LLVM MinGW
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath "$env:RUNNER_TEMP\llvm-mingw"
          $root = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1
          "LLVM_MINGW_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "$($root.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang++ --version
          clang --version
          cmake --version
          ninja --version
          llvm-ml --version

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-llvm-mingw -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:LLVM_MINGW_ROOT\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_MINGW_ROOT\bin\clang++.exe" `
            -DCMAKE_ASM_MASM_COMPILER="$env:LLVM_MINGW_ROOT\bin\llvm-ml.exe"

      - name: Build NteAttackReplay only
        shell: pwsh
        run: |
          cmake --build build-llvm-mingw --target anomaly_builtin_nte_attack_replay --parallel 2

      - name: Verify package
        shell: pwsh
        run: |
          $pkg = "build-llvm-mingw\package\NteAttackReplay"
          if (!(Test-Path "$pkg\plugin.dll")) { throw "plugin.dll missing" }
          if (!(Test-Path "$pkg\manifest.json")) { throw "manifest.json missing" }
          llvm-readobj --file-headers --coff-imports "$pkg\plugin.dll"
          Get-Item "$pkg\plugin.dll" | Format-List FullName,Length
          Get-Content "$pkg\manifest.json" -Raw

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build-llvm-mingw\package\NteAttackReplay\plugin.dll","build-llvm-mingw\package\NteAttackReplay\manifest.json" `
            -DestinationPath "NteAttackReplay-llvm-novs.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-llvm-novs
          path: NteAttackReplay-llvm-novs.zip
          if-no-files-found: error
