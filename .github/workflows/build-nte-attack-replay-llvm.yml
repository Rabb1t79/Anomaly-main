name: Build NteAttackReplay MSVC

on:
  push:
    branches:
      - '**'
    paths:
      - 'plugins/NteAttackReplay/**'
      - 'include/anomaly/sdk/services/nte.h'
      - '.github/workflows/build-nte-attack-replay-llvm.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure MSVC plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE '.build/nte-attack-replay-src'
          $b = Join-Path $env:GITHUB_WORKSPACE '.build/nte-attack-replay'
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          @"
          cmake_minimum_required(VERSION 3.22)
          project(NteAttackReplayStandalone LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(nte_attack_replay SHARED "$env:GITHUB_WORKSPACE/plugins/NteAttackReplay/plugin.cpp")
          target_include_directories(nte_attack_replay PRIVATE "$env:GITHUB_WORKSPACE/include")
          target_compile_definitions(nte_attack_replay PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          set_target_properties(nte_attack_replay PROPERTIES OUTPUT_NAME "plugin" PREFIX "")
          "@ | Set-Content -LiteralPath (Join-Path $src 'CMakeLists.txt') -Encoding UTF8
          cmake -S $src -B $b -G "Visual Studio 17 2022" -A x64
      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b = Join-Path $env:GITHUB_WORKSPACE '.build/nte-attack-replay'
          cmake --build $b --config Release --parallel
          $dll = Join-Path $b 'Release/plugin.dll'
          if (!(Test-Path $dll)) { throw 'plugin.dll was not produced' }
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'dist/NteAttackReplay-windows-x64'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item $dll (Join-Path $pkg 'plugin.dll')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'plugins/NteAttackReplay/manifest.json') (Join-Path $pkg 'manifest.json')
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'dist/NteAttackReplay-windows-x64.zip') -Force
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-windows-x64
          path: dist/NteAttackReplay-windows-x64.zip
          if-no-files-found: error
