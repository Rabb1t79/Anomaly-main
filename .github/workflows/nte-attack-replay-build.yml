name: nte-attack-replay-build

on:
  push:
    branches:
      - feature/nte-attack-replay
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile plugin
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /LD /EHsc /std:c++20 /W4 /permissive- /utf-8 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Iinclude plugins\NteAttackReplay\plugin.cpp /link /OUT:build\plugin.dll /EXPORT:AnomalyPluginEntryV1
          if errorlevel 1 exit /b 1

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\NteAttackReplay | Out-Null
          Copy-Item build\plugin.dll build\NteAttackReplay\plugin.dll
          Copy-Item plugins\NteAttackReplay\manifest.json build\NteAttackReplay\manifest.json
          Copy-Item -Recurse plugins\NteAttackReplay\locales build\NteAttackReplay\locales
          Get-Item build\NteAttackReplay\plugin.dll, build\NteAttackReplay\manifest.json | Format-List FullName,Length

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: NteAttackReplay-1.1.0
          path: build\NteAttackReplay
          if-no-files-found: error
